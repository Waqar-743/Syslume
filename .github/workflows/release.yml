name: "release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this release is already published
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = "v$($config.version)"
          if ('${{ github.ref_name }}' -ne $tag) { throw 'The release tag must match the application version.' }
          $existing = & gh release view $tag --json isDraft,assets 2>$null
          $complete = $false
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            $names = @($release.assets.name)
            $complete = (-not $release.isDraft) -and $names.Contains('Syslume.exe') -and $names.Contains("Syslume_$($config.version)_x64-setup.exe") -and $names.Contains('SHA256SUMS.txt')
          }
          "complete=$($complete.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          # A missing release is expected for a new tag.
          $global:LASTEXITCODE = 0

      - name: setup node
        if: steps.release.outputs.complete != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install Rust stable
        if: steps.release.outputs.complete != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        if: steps.release.outputs.complete != 'true'
        run: npm ci

      - name: verify storage and native unit tests
        if: steps.release.outputs.complete != 'true'
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Treemap tests failed.' }
          ./scripts/test-native.ps1

      - uses: tauri-apps/tauri-action@v0
        if: steps.release.outputs.complete != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_BUILD_JOBS: 1
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "Syslume v__VERSION__"
          releaseBody: "See the assets below to download the latest version of Syslume."
          releaseDraft: true
          prerelease: false

      - name: Attach standalone application and checksums
        if: steps.release.outputs.complete != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/stage-release.ps1
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          gh release upload "v$($config.version)" release/Syslume.exe release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
