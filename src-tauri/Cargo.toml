[package]
name = "syslume"
version = "1.1.0"
description = "Windows system intelligence, monitoring, and storage analysis"
authors = ["Syslume Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "syslume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.0"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
trash = "5"
sha2 = "0.10"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
wmi = { version = "0.18.4", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Performance", "Win32_System_Power"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[dev-dependencies]
tempfile = "3"

# The generated Windows API bindings are large. Avoid expensive optimization
# of forwarding wrappers on 8 GB build machines; application/scanner code keeps
# Cargo's normal optimized release settings.
[profile.release.package.windows]
opt-level = 0
codegen-units = 256
